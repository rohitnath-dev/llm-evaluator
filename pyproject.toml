[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "llm-evaluator"
version = "0.1.0"
description = "A lightweight and model-agnostic LLM evaluation library"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}


[project.optional-dependencies]
hf = [
  "transformers>=4.40"
]
test = [
  "pytest>=8.0"
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]